[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "Production-quality AI-powered Data Analyst with deterministic verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Santhosh Gowda" }
]
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.142.2",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
