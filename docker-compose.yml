services:
  ai-data-analyst:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-data-analyst-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      # Read-write: serves bundled sample CSVs AND the SQLite session store
      # (data/sessions.db) so uploads + conversation context survive restarts.
      - ./backend/data:/app/data
    restart: unless-stopped
