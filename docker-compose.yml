version: '3.8'

services:
  ai-data-analyst:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-data-analyst-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/data:/app/data:ro
    restart: unless-stopped
